<h2 mat-dialog-title>{{ isEditMode ? 'Edit User' : 'Add User' }}</h2>
<mat-dialog-content>
    <form [formGroup]="userForm">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="userForm.get('name')?.hasError('required')">Name is required</mat-error>
            <mat-error *ngIf="userForm.get('name')?.hasError('minlength')">Name must be at least 2 characters</mat-error>
            <mat-error *ngIf="userForm.get('name')?.hasError('maxlength')">Name must be at most 100 characters</mat-error>
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email">
            <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="userForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>
        <mat-form-field *ngIf="!isEditMode" appearance="fill" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password">
            <mat-error *ngIf="userForm.get('password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="userForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
            <mat-error *ngIf="userForm.get('password')?.hasError('maxlength')">Password must be at most 40 characters</mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-button color="primary" (click)="onSubmit()" [disabled]="userForm.invalid">Save</button>
</mat-dialog-actions>
