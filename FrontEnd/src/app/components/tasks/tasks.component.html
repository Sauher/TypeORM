<div class="container">
    <h1>Manage Tasks</h1>
    <button mat-raised-button color="primary" (click)="addTask()"><mat-icon>add</mat-icon></button>

    <div class="mat-elevation-z8">
   
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John">
</mat-form-field>

<mat-form-field>
  <mat-label>Filter by user</mat-label>
  <mat-select (selectionChange)="onUserSelected($event.value)">
    <mat-option value="">All users</mat-option>
    @for (user of users; track user.id) {
      <mat-option [value]="user.id">{{user.name}}</mat-option>
    }
  </mat-select>
</mat-form-field>

<table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8">


  <!-- Position Column -->
  <ng-container matColumnDef="nr">
    <th mat-header-cell *matHeaderCellDef> Nr. </th>
    <td mat-cell *matCellDef="let element"> {{element.nr}} </td>
  </ng-container>

  <!-- Title Column -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let element"> {{element.title}} </td>
  </ng-container>

  <!-- Description Column -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
  </ng-container>

  <!-- User Column -->
  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef> User </th>
    <td mat-cell *matCellDef="let element"> {{element.user?.name}} </td>
  </ng-container>

  <!-- Completed Column -->
  <ng-container matColumnDef="completed">
    <th mat-header-cell *matHeaderCellDef> Completed </th>
    <td mat-cell *matCellDef="let element"> {{element.completed}} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let element" class="text-end">
      <button mat-raised-button color="primary" (click)="editTask(element)"><mat-icon>edit</mat-icon></button>
      <button mat-raised-button color="warn" (click)="deleteTask(element)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25]" 
showFirstLastButtons>
</mat-paginator>
</div>
